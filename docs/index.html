<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coda CSV PDF Generator</title>
    <link rel="stylesheet" href="./styles.css?v=20260310h" />
  </head>
  <body>
    <main class="container">
      <div class="app-shell">
        <section class="panel control-panel">
          <h2>Control Center</h2>
          <label class="field">
            <span class="field-head">
              <span>CSV file</span>
              <span class="field-help" tabindex="0" aria-label="CSV help">
                <span class="field-help-icon">i</span>
                <span class="field-help-panel">Upload the CSV exported from Coda with the required headers.</span>
              </span>
            </span>
            <input id="csvFile" type="file" accept=".csv,text/csv" />
          </label>

          <p class="auto-run-note">
            Upload once. The app auto-generates reports and downloads PDF(s) with no additional steps.
          </p>
          <div class="legacy-hidden" aria-hidden="true">
            <select id="studentSelect" disabled>
              <option>Upload CSV first</option>
            </select>
            <select id="docTitleSelect" disabled>
              <option value="">Select document title</option>
              <option value="Application Autopsy">Application Autopsy</option>
              <option value="Committee Review">Committee Review</option>
            </select>
            <input id="lsatInput" type="text" inputmode="numeric" placeholder="e.g. 171" disabled />
            <input id="gpaInput" type="text" inputmode="decimal" placeholder="e.g. 3.74" disabled />
            <select id="kjdSelect" disabled>
              <option value="Not KJD">Not KJD</option>
              <option value="KJD">KJD</option>
            </select>
            <select id="urmSelect" disabled>
              <option value="Non-URM">Non-URM</option>
              <option value="URM">URM</option>
            </select>
            <textarea id="nextStepsInput" rows="3" placeholder="Add next steps" disabled></textarea>
            <p id="inputHint" class="input-hint"></p>
            <div class="actions">
              <button id="generateBtn" disabled>Generate Report</button>
              <button id="downloadPdfBtn" disabled>Download PDF</button>
            </div>
          </div>
          <p id="tagSourceStatus" class="tag-source-status">Tag source: loading...</p>

          <p id="status" class="status">Waiting for CSV upload.</p>
          <div id="validation" class="validation"></div>
        </section>
      </div>
      <div id="previewRoot" class="preview-root preview-root-hidden" aria-hidden="true"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="./app.js?v=20260310i"></script>
  </body>
</html>
